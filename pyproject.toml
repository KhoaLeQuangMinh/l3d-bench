[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "l3d-bench"
version = "0.1.0"
description = "Fair benchmark for laparoscopic liver landmark detection on L3D"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "medpy>=0.4",
  "scipy>=1.10",
]

[project.optional-dependencies]
train = ["torch>=2.1", "transformers>=4.40"]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["l3d_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
